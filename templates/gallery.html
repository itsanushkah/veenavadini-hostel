{% extends "base.html" %}
{% load static %}
{% block title %}Gallery | Veena Vadini Girls Hostel{% endblock %}

{% block content %}
<section class="py-5 bg-light">
  <div class="container">
    <h2 class="text-center mb-4">Our Hostel Gallery</h2>

    {% for title, images in sections %}
      <h3 class="h4 mt-5 mb-3" style="color: #3b2f2f">{{ title }}</h3>
      <div class="row g-3 gallery-grid">
        {% for image in images %}
          <div class="col-6 col-md-4 col-lg-3">
            <a href="{% static 'img/'|add:image %}" target="_blank" rel="noopener">
              <img src="{% static 'img/'|add:image %}" alt="{{ title }} at Veena Vadini Girls Hostel" loading="lazy" />
            </a>
          </div>
        {% endfor %}
      </div>
    {% endfor %}
  </div>
</section>
{% endblock %}
