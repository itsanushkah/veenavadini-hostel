{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Veena Vadini Girls Hostel | Kolar Road, Bhopal{% endblock %}</title>
    <meta name="description" content="{% block description %}Veena Vadini Girls Hostel on Kolar Road, Bhopal: safe, hygienic and homely accommodation for girls, with home-style mess food, 24/7 CCTV and a green garden. Running for over 17 years.{% endblock %}" />
    <meta name="theme-color" content="#8a2a2b" />
    <link rel="icon" href="{% static 'icons/favicon.ico' %}" sizes="48x48" />
    <link rel="icon" href="{% static 'icons/favicon.svg' %}" type="image/svg+xml" />
    <link rel="icon" href="{% static 'icons/favicon-32.png' %}" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="{% static 'icons/apple-touch-icon.png' %}" />
    <link rel="manifest" href="{% static 'icons/site.webmanifest' %}" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&display=swap" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <script>document.documentElement.classList.add("js");</script>
  </head>

  <body>
    {% include "header.html" %}

    <main>
      {% block content %}{% endblock %}
    </main>

    {% include "footer.html" %}

    <a href="tel:+917000783317" class="call-fab" aria-label="Call the hostel"><i class="bi bi-telephone-fill"></i></a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/site.js' %}"></script>
  </body>
</html>
